<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<meta name="description" content="Panel moderno de resultados y estadísticas de fútbol">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/main.css">
<title>Fútbol Analytics</title>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">⚽</span><div><strong>Fútbol Analytics</strong><small>Datos, estadísticas y análisis</small></div></div>
    <nav id="nav">
      <button data-view="dashboard" class="nav-item active">⌂ <span>Inicio</span></button>
      <button data-view="competitions" class="nav-item">◉ <span>Competiciones</span></button>
      <button data-view="matches" class="nav-item">▣ <span>Partidos</span></button>
      <button data-view="teamAnalysis" class="nav-item">⌕ <span>Analizar equipos</span></button>
      <button data-view="teams" class="nav-item">◌ <span>Equipos</span></button>
      <button data-view="standings" class="nav-item">☷ <span>Clasificaciones</span></button>
    </nav>
    <div class="sidebar-foot"><span class="status-dot"></span> Datos locales disponibles</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Abrir menú">☰</button>
      <div><div class="eyebrow">FÚTBOL ANALYTICS</div><h1 id="pageTitle">Resumen</h1></div>
      <div class="top-actions"><button id="refreshBtn" class="secondary-btn">↻ Actualizar</button></div>
    </header>
    <section id="app" class="content"></section>
  </main>
</div>
<div id="toast" class="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
